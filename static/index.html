<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTG RAG Search — カード検索</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --panel-edge: #2a2e36;
    --text: #e8e6e0;
    --text-dim: #9a978f;
    --accent: #c9a54c;           /* 金枠＝レア */
    --w: #f5f0d8; --u: #9ec6e0; --b: #a89c94; --r: #e08a63; --g: #93b483;
    font-size: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Noto Sans JP", sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 2.2rem 1rem 1.2rem;
    text-align: center;
    background:
      linear-gradient(180deg, rgba(201,165,76,.08), transparent 70%);
  }
  header h1 {
    font-size: 1.7rem;
    letter-spacing: .06em;
    font-weight: 700;
  }
  header h1 .mana-dots { letter-spacing: .12em; font-size: 1.2rem; vertical-align: middle; }
  header p { color: var(--text-dim); margin-top: .4rem; font-size: .85rem; }

  .search-box {
    max-width: 720px;
    margin: 1.2rem auto 0;
    padding: 0 1rem;
    display: flex;
    gap: .5rem;
    flex-wrap: wrap;
  }
  .search-box input[type=text] {
    flex: 1 1 320px;
    padding: .8rem 1rem;
    border-radius: 10px;
    border: 1px solid var(--panel-edge);
    background: var(--panel);
    color: var(--text);
    font-size: 1rem;
    outline: none;
  }
  .search-box input[type=text]:focus { border-color: var(--accent); }
  .search-box select {
    padding: .8rem .6rem;
    border-radius: 10px;
    border: 1px solid var(--panel-edge);
    background: var(--panel);
    color: var(--text);
  }
  .search-box button {
    padding: .8rem 1.6rem;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #14161a;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  .search-box button:disabled { opacity: .5; cursor: wait; }

  .status {
    max-width: 720px;
    margin: .8rem auto 0;
    padding: 0 1rem;
    color: var(--text-dim);
    font-size: .85rem;
    min-height: 1.4em;
  }
  .status .route-badge {
    display: inline-block;
    padding: .15em .6em;
    border-radius: 99px;
    font-size: .78rem;
    margin-right: .5em;
    border: 1px solid var(--panel-edge);
  }
  .route-structured_direct { color: #8fd18f; border-color: #3a5c3a !important; }
  .route-router            { color: #9ec6e0; border-color: #33506a !important; }
  .route-no_rewrite        { color: var(--text-dim); }

  main {
    max-width: 720px;
    margin: 1rem auto 4rem;
    padding: 0 1rem;
    display: grid;
    gap: .8rem;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-left: 4px solid var(--rarity, var(--panel-edge));
    border-radius: 12px;
    padding: 1rem 1.1rem;
  }
  /* カード画像サムネイル（2026-07-26）: Scryfall CDN 直リンク。
     float 右置き＝既存のテキストレイアウトを崩さない。読み込み失敗時は
     onerror で自身を消す＝画像なしの従来表示に自然に戻る */
  .card .thumb {
    float: right;
    width: 146px;
    border-radius: 7px;
    margin: 0 0 .6rem .9rem;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
  }
  .card::after { content: ""; display: block; clear: both; }
  /* 表記言語トグル（2026-07-27）: データは常に日英両方 API から来ている——
     切替は表示だけの話なので再検索不要・フロント完結 */
  #lang {
    background: var(--panel);
    color: var(--text-dim);
    border: 1px solid var(--panel-edge);
    /* 固定幅（min-width だと「EN」⇔「日」で伸縮し、隣の検索ボタンが動いて
       連打中の誤クリックを生む＝2026-07-27 本人指摘） */
    width: 3.2rem;
    padding-left: 0;
    padding-right: 0;
  }
  #lang.on { color: var(--text); border-color: var(--accent, #7aa2f7); }
  @media (max-width: 560px) { .card .thumb { width: 104px; } }
  .card .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: .6rem;
    flex-wrap: wrap;
  }
  .card .names { font-weight: 700; font-size: 1.05rem; }
  .card .names .en { color: var(--text-dim); font-weight: 400; font-size: .85rem; margin-left: .5em; }
  .mana { white-space: nowrap; }
  .mana span {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.35em; height: 1.35em;
    border-radius: 50%;
    font-size: .78rem;
    font-weight: 700;
    color: #222;
    background: #cfcfcf;
    margin-left: .15em;
    border: 1px solid rgba(0,0,0,.35);
  }
  .mana .mw { background: var(--w); } .mana .mu { background: var(--u); }
  .mana .mb { background: var(--b); } .mana .mr { background: var(--r); }
  .mana .mg { background: var(--g); }
  .card .typeline {
    color: var(--text-dim);
    font-size: .84rem;
    margin-top: .3rem;
    display: flex;
    justify-content: space-between;
    gap: .6rem;
  }
  .card .pt { color: var(--text); font-weight: 700; }
  .card .oracle {
    margin-top: .6rem;
    font-size: .92rem;
    line-height: 1.65;
    white-space: pre-wrap;
  }
  .card .oracle.en { color: var(--text-dim); font-size: .82rem; margin-top: .4rem; }
  .card .archetypes { margin-top: .6rem; }
  .card .archetypes span {
    display: inline-block;
    font-size: .75rem;
    color: var(--text-dim);
    border: 1px solid var(--panel-edge);
    border-radius: 99px;
    padding: .1em .6em;
    margin: 0 .3em .3em 0;
  }
  .empty, .error {
    text-align: center;
    color: var(--text-dim);
    padding: 2rem 0;
  }
  .error { color: #e08a63; }
  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: .75rem;
    padding: 1rem;
  }
</style>
</head>
<body>

<header>
  <h1><span class="mana-dots">⚪🔵⚫🔴🟢</span> MTG RAG Search</h1>
  <p>日本語で聞ける Magic: The Gathering カード検索 — ハイブリッド検索 + 構造化フィルタ</p>
</header>

<div class="search-box">
  <input id="q" type="text" placeholder="例: 速攻を持たないクリーチャー / モダンの単体除去"
         autocomplete="off">
  <select id="format">
    <option value="">フォーマット指定なし</option>
    <option value="standard">スタンダード</option>
    <option value="pioneer">パイオニア</option>
    <option value="modern">モダン</option>
    <option value="legacy">レガシー</option>
    <option value="vintage">ヴィンテージ</option>
    <option value="pauper">パウパー</option>
  </select>
  <button id="go">検索</button>
  <button id="lang" type="button" title="カード表記の言語切替（検索は日英どちらでも可）">EN</button>
</div>

<div class="status" id="status"></div>
<main id="results"></main>

<footer>ローカル開発ビルド — ルーター: 7B (Ollama) / DB: PostgreSQL+pgvector</footer>

<script>
// API の接続先（2026-07-28）: ローカル開発は同一オリジン（uvicorn:8000）・
// CloudFront 配信時は API Gateway へ（別オリジン・CORS は API 側で許可済み）
const API_BASE = location.hostname.endsWith("cloudfront.net")
  ? "https://agq13n3owe.execute-api.ap-northeast-1.amazonaws.com" : "";
const $q = document.getElementById("q");
const $go = document.getElementById("go");
const $fmt = document.getElementById("format");
const $status = document.getElementById("status");
const $results = document.getElementById("results");
const $lang = document.getElementById("lang");
// カード表記: "ja"（既定・日本語主）/ "en"（英語主）。localStorage で記憶
let cardLang = localStorage.getItem("cardLang") || "ja";
let lastCards = null;   // 直近の結果（言語切替時に再描画するため・再検索しない）
function paintLangBtn() {
  $lang.textContent = cardLang === "ja" ? "EN" : "日";
  $lang.classList.toggle("on", cardLang === "en");
}
paintLangBtn();
$lang.addEventListener("click", () => {
  cardLang = cardLang === "ja" ? "en" : "ja";
  localStorage.setItem("cardLang", cardLang);
  paintLangBtn();
  if (lastCards) $results.innerHTML = lastCards.map(cardHtml).join("");
});

const RARITY_COLOR = {
  mythic: "#e05e26", rare: "#c9a54c", uncommon: "#a9bcc4", common: "#5a5e66",
};
const ROUTE_LABEL = {
  structured_direct: "辞書直行（LLM不使用）",
  router: "ルーター解析",
  no_rewrite: "素の検索",
};

// {2}{W}{U} → 丸チップ列
function manaHtml(cost) {
  if (!cost) return "";
  const sym = { W: "mw", U: "mu", B: "mb", R: "mr", G: "mg" };
  return (cost.match(/{[^}]+}/g) || []).map(t => {
    const v = t.slice(1, -1);
    const cls = sym[v] || "";
    return `<span class="${cls}">${v}</span>`;
  }).join("");
}

function esc(s) {
  return (s || "").replace(/[&<>"']/g,
    c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function cardHtml(c) {
  const rarity = RARITY_COLOR[(c.rarity || "").toLowerCase()] || "var(--panel-edge)";
  // 表記言語（cardLang）で主従を入れ替える。en モードは英名・英文を主にし、
  // 日本語は副表示（データはどちらのモードでも既に手元にある＝再検索しない）
  const jaMode = cardLang !== "en";
  const primary = jaMode
    ? (c.japanese_name ? esc(c.japanese_name) : esc(c.card_name))
    : esc(c.card_name);
  const secondary = jaMode
    ? (c.japanese_name ? `<span class="en">${esc(c.card_name)}</span>` : "")
    : (c.japanese_name ? `<span class="en">${esc(c.japanese_name)}</span>` : "");
  const ja = primary;
  const en = secondary;
  const pt = (c.power != null && c.toughness != null)
    ? `<span class="pt">${esc(String(c.power))}/${esc(String(c.toughness))}</span>` : "";
  const oracleJa = (jaMode && c.japanese_oracle_text)
    ? `<div class="oracle">${esc(c.japanese_oracle_text)}</div>` : "";
  const oracleEn = (!jaMode || !c.japanese_oracle_text) && c.oracle_text
    ? `<div class="oracle${jaMode ? " en" : ""}">${esc(c.oracle_text)}</div>` : "";
  const arch = (c.archetypes && c.archetypes.length)
    ? `<div class="archetypes">${c.archetypes.map(a => `<span>${esc(a)}</span>`).join("")}</div>` : "";
  // 表記言語に合わせて画像も切替（日本語印刷が無いカードは英語画像のまま）
  const imgUrl = (jaMode && c.image_url_ja) ? c.image_url_ja : c.image_url;
  const img = imgUrl
    ? `<img class="thumb" src="${esc(imgUrl)}" alt="${esc(c.card_name)}"
            loading="lazy" onerror="this.remove()">` : "";
  return `<div class="card" style="--rarity:${rarity}">
    ${img}
    <div class="head">
      <div class="names">${ja}${en}</div>
      <div class="mana">${manaHtml(c.mana_cost)}</div>
    </div>
    <div class="typeline"><span>${esc(c.type_line)}</span>${pt}</div>
    ${oracleJa}${oracleEn}${arch}
  </div>`;
}

// コールドスタート対策の再試行つき fetch（2026-07-31）:
// 自動停止からの復帰（Lambda 起動 20〜30 秒 + Aurora 目覚め 15 秒）が API Gateway の
// 天井約 30 秒を超えると、裏では起動が進んでいるのにゲートウェイが先に 504 を返す。
// 5xx とネットワーク断だけを再試行し（4xx=クエリ自身の問題は即表示）、
// 利用者には「エラー」でなく「起動中」と正直に見せる。
async function fetchWithWarmup(url, options) {
  const RETRIES = 3, WAIT_MS = 3000;
  for (let i = 0; ; i++) {
    try {
      const resp = await fetch(url, options);
      if (resp.status < 500) return resp;          // 成功 or 4xx はそのまま返す
      if (i >= RETRIES) return resp;
    } catch (e) {                                   // ネットワーク断（504 含む）
      if (i >= RETRIES) throw e;
    }
    $status.textContent =
      `システム起動中です…（初回アクセスは最大 1 分ほどかかります・再試行 ${i + 1}/${RETRIES}）`;
    await new Promise(r => setTimeout(r, WAIT_MS));
  }
}

async function search() {
  const query = $q.value.trim();
  if (!query) return;
  $go.disabled = true;
  $results.innerHTML = "";
  $status.textContent = "検索中…（ルーター解析が入る場合は十数秒かかります）";
  const t0 = performance.now();
  try {
    const resp = await fetchWithWarmup(API_BASE + "/search", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        query,
        format: $fmt.value || null,
        top_k: 10,
      }),
    });
    if (!resp.ok) {
      const detail = (await resp.json().catch(() => ({}))).detail || resp.statusText;
      throw new Error(detail);
    }
    const data = await resp.json();
    const ms = Math.round(performance.now() - t0);
    const routeLabel = ROUTE_LABEL[data.route] || data.route;
    const backend = data.router_backend ? ` / ${data.router_backend}` : "";
    $status.innerHTML =
      `<span class="route-badge route-${esc(data.route)}">${esc(routeLabel)}${esc(backend)}</span>` +
      `${data.cards.length}件 · ${ms}ms` +
      (data.detected_format ? ` · フォーマット: ${esc(data.detected_format)}` : "");
    lastCards = data.cards;
    $results.innerHTML = data.cards.length
      ? data.cards.map(cardHtml).join("")
      : `<div class="empty">該当するカードが見つかりませんでした。</div>`;
  } catch (e) {
    $status.textContent = "";
    $results.innerHTML = `<div class="error">エラー: ${esc(e.message)}</div>`;
  } finally {
    $go.disabled = false;
  }
}

$go.addEventListener("click", search);
$q.addEventListener("keydown", e => { if (e.key === "Enter") search(); });
$q.focus();

// 予熱は撤去（2026-08-01 本人裁定「質問を投げてもらってからお金発生」）:
// 7/31 に「ページを開いた時点で /health?deep=true」を仕込んだが、実測で
// 検索しない訪問者（クローラー含む）1 人あたり Lambda コールド 30 秒級＋
// Aurora 起床の費用が発生すると確認（WORKLOG 7/31-8/1 の一見さん事件）。
// 課金の発火点は利用者の検索実行のみとする。初回の遅さは fetchWithWarmup の
// 再試行と「起動中です」表示が受け止める。
</script>
</body>
</html>
